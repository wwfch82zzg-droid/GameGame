 ${d&&d.ready?`<button class="btn glow" onclick="publish()">${d.o=="h"?"Найти игру на компьютере":"Собрать провода"}</button>`:`<button class="btn ${d?"":"glow"}" onclick="openW()" ${d?"disabled":""}>${svg("plus",20)}Создать игру</button>`}</div>
 <div class="card"><h3>Сообщество</h3>${S.msgs.length?S.msgs.slice(0,5).map(m=>{const g=S.games.find(x=>x.id==m.gid);return g?`<div class="row"><div class="t">Ваша игра «${esc(g.n)}» очень понравилась сообществу. Они ждут обновление.<small>${NM[m.m]} ${m.y}</small></div><button class="btn s" ${S.dev?"disabled":""} onclick="startUpd(${g.id})">Обновить</button></div>`:""}).join(""):`<p class="dim" style="margin:0">Пока тихо. Выпускай игры с высокой оценкой, и сообщество начнёт просить обновления.</p>`}</div>
 <div class="card"><h3>Отзывы игроков</h3>${S.games.length?S.games.slice(0,3).flatMap(g=>(g.rv||[]).slice(0,2).map(r=>({...r,gn:g.n}))).slice(0,4).map(r=>`<div class="row"><div class="av">${r.u[0]}</div><div class="t"><div class="stars">${stars(r.s)}</div>${r.t}<small>${r.u} · «${esc(r.gn)}»</small></div></div>`).join(""):`<p class="dim" style="margin:0">Отзывы появятся после выхода первой игры.</p>`}</div>`;;
 if(t==1)h=`<div class="card"><h3>Нанять сотрудников · ${hc()} из ${cap()}</h3>${ST.map(s=>{const c=price(s[0],s[2]),lk=S.lvl<s[3];return `<div class="row" style="${lk?"opacity:.55":""}"><div class="av">${lk?svg("lock",20):s[1][0]}</div><div class="t"><b>${s[1]}</b> · в штате ${pow(s[0])}<small>${lk?"Откроется с "+s[3]+" уровня":"Зарплата "+Math.round(s[2]/40)+" $ в месяц"}</small></div><button class="btn s" ${lk||S.money<c||hc()>=cap()?"disabled":""} onclick="hire('${s[0]}',${c})">${lk?"Закрыто":money(c)}</button></div>`}).join("")}</div>`;
 if(t==2)h=`<div class="card"><h3>Мои игры</h3>${S.games.length?S.games.map(g=>`<div class="row">${ico(g)}<div class="t"><b>${esc(g.n)}</b>${g.v>1?" · v"+g.v:""}<small>${G[g.g][0]} · ${g.y} · ${g.o=="v"?"вертикальная":"горизонтальная"}</small><div class="stars">${stars(g.sc/2)}<span class="dim" style="margin-left:6px">${(g.sc/2).toFixed(1)}</span></div><div style="margin-top:8px"><small>Ажиотаж ${Math.round(g.h||0)}%</small><div class="bar" style="margin-top:4px"><i style="width:${Math.min(100,g.h||0)}%"></i></div></div><div class="acts"><button class="btn o s" onclick="showRv(${g.id})">Отзывы</button><button class="btn s" ${S.dev?"disabled":""} onclick="startUpd(${g.id})">Обновить</button>${g.pl?`<button class="btn s" onclick="platform(${g.id})">Плейсы (${g.pl.p.filter(p=>p.me).length})</button>`:g.sc>=9?`<button class="btn s" ${S.money<PLC?"disabled":""} onclick="plUp(${g.id})">Платформа ${money(PLC)}</button>`:""}</div>${!g.pl&&g.sc<9?`<small>Платформа плейсов откроется при пяти звёздах</small>`:""}</div><b style="color:var(--ok)">+${money(g.inc)}</b></div>`).join(""):`<p class="dim">Пока пусто. Нажми «Создать игру» на вкладке «Студия».</p>`}</div>`;
 if(t==3)h=evTL();

 <div class="card"><h3>Прогресс</h3><p class="dim" style="margin:0 0 16px">Сброс удалит все игры, команду и деньги.</p><button class="btn o" onclick="if(confirm('Начать с нуля?')){S=def();lastP=0;draw(true)}">Сбросить прогресс</button></div>
 <div class="card"><h3>Достижения: ${AC.filter(a=>a[1]()).length} из ${AC.length}</h3>${AC.map(a=>{const ok=a[1]();return `<div class="row" style="${ok?"":"opacity:.5"}"><div class="av" style="${ok?"background:var(--ok);color:#fff":""}">${svg(ok?"check":"lock",20)}</div><div class="t"><b>${a[0]}</b></div></div>`}).join("")}</div>`;
 $("main").innerHTML=`<div class="pg ${a?"pg-in":""}">${h}</div>`;
